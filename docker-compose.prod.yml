# Entorno de PRODUCCIÓN para un VPS.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Diferencias con el compose de desarrollo:
#   - No hay bind mounts del código: la imagen es inmutable.
#   - Postgres y Redis NO publican puertos al host; solo se ven en la red interna.
#   - Nginx termina TLS y es lo único expuesto (80/443).
#   - Los procesos corren con usuario sin privilegios y tienen healthcheck.

services:
  backend:
    build:
      context: ./BackEnd
      target: production
    env_file:
      - .env
    environment:
      DJANGO_ENV: production
      REDIS_HOST: redis
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - static_files:/staticfiles
      - media_files:/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gaucho_weather_network
    restart: always
    # Sin `ports`: solo el proxy llega al backend.
    expose:
      - "8001"

  frontend:
    build:
      context: ./FrontEnd
      target: production
      args:
        # Vite congela estos valores en el bundle durante el build.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
    networks:
      - gaucho_weather_network
    restart: always
    expose:
      - "80"

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params_gaucho:/etc/nginx/proxy_params_gaucho:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - static_files:/staticfiles:ro
      - media_files:/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - gaucho_weather_network
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    # Reintenta la renovación cada 12 horas. Let's Encrypt renueva recién
    # dentro de los 30 días previos al vencimiento; el resto de las veces
    # el comando no hace nada.
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done;'
    restart: always

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - gaucho_weather_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - redis_data:/data
    networks:
      - gaucho_weather_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
  static_files:
  media_files:

networks:
  gaucho_weather_network:
    driver: bridge
