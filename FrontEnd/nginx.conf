server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de los assets de texto. Las imágenes y fuentes ya vienen
    # comprimidas y volver a pasarlas por gzip solo gasta CPU.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Los assets que emite Vite llevan hash en el nombre: si cambia el
    # contenido cambia la URL, así que se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html NO se cachea: es quien apunta a los assets nuevos después de
    # cada deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA: cualquier ruta desconocida la resuelve React Router en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeceras de seguridad para el contenido estático.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Los archivos ocultos no se sirven nunca (.env, .git, etc.).
    location ~ /\. {
        deny all;
    }
}
