# Reverse proxy del VPS. Termina TLS y reparte:
#   /api, /healthz, /readyz -> backend (gunicorn)
#   todo lo demás           -> frontend (build estático)
#
# Reemplazá gauchoweather.com por tu dominio antes del primer deploy.
# El bloque 443 queda comentado hasta emitir el certificado (ver DEPLOYMENT.md):
# Nginx no arranca si le apuntás a un certificado que todavía no existe.

upstream backend_upstream {
    server backend:8001;
}

upstream frontend_upstream {
    server frontend:80;
}

# Límite de peticiones a la API. Tomorrow.io se paga por request y el login es
# blanco de fuerza bruta; esto corta el abuso antes de llegar a Django.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name gauchoweather.com www.gauchoweather.com;

    # Certbot valida el dominio dejando un archivo acá. Tiene que responder por
    # HTTP siempre, incluso con la redirección a HTTPS activa.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Una vez emitido el certificado, descomentá el redirect y el bloque 443.
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://frontend_upstream;
        include /etc/nginx/proxy_params_gaucho;
    }

    location ~ ^/(api|healthz|readyz) {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_upstream;
        include /etc/nginx/proxy_params_gaucho;
    }

    location /static/ {
        alias /staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /media/;
        expires 7d;
    }
}

