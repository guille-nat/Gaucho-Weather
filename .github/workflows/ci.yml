name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Una corrida por rama: si llegan dos pushes seguidos, la vieja se cancela.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Barrera barata: falla en segundos si quedó un conflicto sin resolver o un
  # secreto suelto, sin gastar el resto del pipeline.
  hygiene:
    name: Higiene del repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sin marcadores de conflicto
        run: |
          if grep -rInE '^(<{7}|={7}|>{7})( |$)' \
              --exclude-dir=node_modules --exclude-dir=.git . ; then
            echo "::error::Hay marcadores de conflicto de merge sin resolver."
            exit 1
          fi
          echo "Sin marcadores de conflicto."

      - name: package-lock.json es JSON válido
        run: python3 -c "import json; json.load(open('FrontEnd/package-lock.json'))"

      - name: Sin archivos de secretos versionados
        run: |
          if git ls-files | grep -EI '\.(key|pem|p12|pfx)$|(^|/)\.env$' ; then
            echo "::error::Hay material sensible versionado."
            exit 1
          fi
          echo "Sin secretos versionados."

  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: BackEnd/requirements.txt

      - name: Instalar dependencias
        working-directory: BackEnd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chequeos de Django
        working-directory: BackEnd
        env:
          DJANGO_ENV: testing
          SECRET_KEY: ci-only-not-a-real-secret
          SECRET_KEY_JWT: ci-only-not-a-real-jwt-secret
          TOMORROW_API_KEY: ci-only
        run: python manage.py check

      - name: Sin migraciones pendientes
        working-directory: BackEnd
        env:
          DJANGO_ENV: testing
          SECRET_KEY: ci-only-not-a-real-secret
          SECRET_KEY_JWT: ci-only-not-a-real-jwt-secret
          TOMORROW_API_KEY: ci-only
        # Si alguien cambia un modelo y no genera la migración, esto lo frena.
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        working-directory: BackEnd
        env:
          DJANGO_ENV: testing
          SECRET_KEY: ci-only-not-a-real-secret
          SECRET_KEY_JWT: ci-only-not-a-real-jwt-secret
          TOMORROW_API_KEY: ci-only
        run: python manage.py test --verbosity 2

      - name: Chequeo de despliegue de Django
        working-directory: BackEnd
        env:
          DJANGO_ENV: production
          # Larga a propósito: con una clave corta el propio chequeo emite
          # security.W009 y el resultado dejaría de ser informativo.
          SECRET_KEY: ci-only-nunca-uses-esta-clave-en-un-entorno-real-0123456789
          SECRET_KEY_JWT: ci-only-nunca-uses-esta-clave-jwt-en-un-entorno-real-9876543210
          TOMORROW_API_KEY: ci-only
          ALLOWED_HOSTS: example.com
          CORS_ALLOWED_ORIGINS: https://example.com
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        # Corta ante ERRORES (DEBUG activo, cookies inseguras, secretos
        # faltantes). Las WARNINGS quedan visibles en el log: security.W005 y
        # W021 son las de HSTS, que se activan a mano cuando el certificado ya
        # renueva solo (ver DEPLOYMENT.md).
        run: python manage.py check --deploy --fail-level ERROR

  frontend:
    name: Frontend — lint y build
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.17"
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Instalar dependencias
        working-directory: FrontEnd
        # npm ci exige un lockfile íntegro: es la red que atrapa un
        # package-lock.json roto antes del deploy.
        run: npm ci

      - name: Lint
        working-directory: FrontEnd
        run: npm run lint

      - name: Build
        working-directory: FrontEnd
        env:
          VITE_API_BASE_URL: https://api.example.com/api
        run: npm run build

  docker:
    name: Imágenes de producción
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./BackEnd
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./FrontEnd
          target: production
          push: false
          build-args: |
            VITE_API_BASE_URL=https://api.example.com/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
