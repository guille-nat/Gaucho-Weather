# Entorno de DESARROLLO.
# Para producción usá docker-compose.prod.yml.
#
#   docker compose up --build
#
# El backend queda en http://localhost:8001 y el frontend en http://localhost:5174

services:
  backend:
    build:
      context: ./BackEnd
      target: development
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - ./BackEnd:/app
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DJANGO_ENV: developer
      REDIS_HOST: redis
      # Dentro de la red de Docker, Redis y Postgres escuchan en sus puertos
      # internos; los del .env apuntan a los mapeos del host (6380/5433).
      REDIS_PORT: 6379
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gaucho_weather_network
    restart: unless-stopped

  frontend:
    build:
      context: ./FrontEnd
      target: development
    volumes:
      - ./FrontEnd:/app
      # Volúmenes anónimos: preservan lo instalado en la imagen y evitan que el
      # bind mount del host pise node_modules.
      - /app/node_modules
      - /app/.vite
    ports:
      - "5174:5173"
    depends_on:
      - backend
    networks:
      - gaucho_weather_network
    environment:
      CHOKIDAR_USEPOLLING: "true"  # Hot reload en Docker
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - gaucho_weather_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - gaucho_weather_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:

networks:
  gaucho_weather_network:
    driver: bridge
