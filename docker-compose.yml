# Development environment. Production: docker-compose.prod.yml.
name: gaucho-weather

x-backend: &backend
  build:
    context: ./backend
    target: dev
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME:-gaucho}
    DB_USER: ${DB_USER:-gaucho}
    DB_PASSWORD: ${DB_PASSWORD:-gaucho}
    REDIS_URL: redis://redis:6379
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-gaucho}
      POSTGRES_USER: ${DB_USER:-gaucho}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gaucho}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "${BACKEND_PORT:-8001}:8000"

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_SATELLITE_TILES_URL: ${VITE_SATELLITE_TILES_URL:-}
      VITE_SATELLITE_ATTRIBUTION: ${VITE_SATELLITE_ATTRIBUTION:-}
      VITE_SATELLITE_MAX_ZOOM: ${VITE_SATELLITE_MAX_ZOOM:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
